name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o carfolio-api ./cmd/api

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.API_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.API_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload and restart
        env:
          TARGET: deploy@${{ secrets.API_SSH_HOST }}
        run: |
          scp carfolio-api "$TARGET:carfolio-api.new"
          ssh "$TARGET" sudo /usr/local/bin/carfolio-deploy
