services:
  db:
    image: postgres:17-alpine
    container_name: carfolio-db
    environment:
      POSTGRES_USER: carfolio
      POSTGRES_PASSWORD: carfolio # local development only
      POSTGRES_DB: carfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carfolio -d carfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
