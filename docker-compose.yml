# Pinned project name: container and volume are "carvisio-*" whatever the
# checkout directory is called.
name: carvisio

services:
  db:
    image: postgres:17-alpine
    container_name: carvisio-db
    environment:
      POSTGRES_USER: carvisio
      POSTGRES_PASSWORD: carvisio # local development only
      POSTGRES_DB: carvisio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carvisio -d carvisio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
