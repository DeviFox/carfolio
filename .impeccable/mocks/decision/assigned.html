<!doctype html>
<!-- carfolio decision round · assigned · pegboard -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>carfolio — assigned (pegboard)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@500;700;900&family=Barlow+Condensed:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tan:#b8906a; --tan-dark:#8c6a4a; --peg:#3a2516; --ink:#17110d;
    --yellow:#e5b21e; --red:#c33421; --cream:#f3ead8; --grease:#271c13;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden;font-family:"Barlow Condensed",sans-serif;color:var(--ink);background:#b8906a}
  .wall{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 50%, var(--peg) 2px, transparent 2.5px) 0 0/40px 40px,
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.08), transparent 60%),
      radial-gradient(ellipse at 80% 85%, rgba(0,0,0,.35), transparent 60%),
      linear-gradient(135deg, var(--tan), var(--tan-dark));
  }
  .frame{position:absolute;inset:28px;border:6px solid var(--grease);box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
  .nav{position:absolute;top:28px;left:28px;right:28px;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;color:var(--cream);z-index:3;background:var(--grease);border-bottom:6px solid var(--grease)}
  .brand{font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:900;font-size:30px;letter-spacing:.12em;color:var(--cream);text-shadow:1px 1px 0 rgba(0,0,0,.5)}
  .nav-dymo{display:flex;gap:10px;font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:13px}
  .dymo{background:#1b140d;color:var(--cream);padding:6px 14px;border-radius:3px;box-shadow:inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,.08)}
  .main{position:absolute;top:94px;left:28px;right:28px;bottom:84px;display:flex}
  .board{flex:0 0 60%;position:relative;padding:60px 50px}
  .silhouette{position:absolute;color:var(--ink);opacity:.85}
  .s-wrench{top:170px;left:70px;width:200px;height:70px}
  .s-filter{top:280px;left:300px;width:120px;height:120px}
  .s-plug{top:260px;left:460px;width:60px;height:120px}
  .s-funnel{top:450px;left:120px;width:110px;height:140px}
  .s-tire{top:470px;left:290px;width:160px;height:160px}
  .s-brake{top:460px;left:490px;width:140px;height:140px}
  .headline{font-family:"Big Shoulders Stencil Display",sans-serif;font-weight:900;font-size:76px;line-height:.92;letter-spacing:.02em;color:var(--grease);text-shadow:2px 2px 0 rgba(0,0,0,.18);max-width:620px;position:relative;z-index:2}
  .headline em{font-style:normal;color:var(--grease);background:var(--yellow);padding:0 .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .kicker{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.3em;font-size:14px;color:var(--grease);background:var(--yellow);display:inline-block;padding:4px 12px;margin-bottom:18px;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
  .arrow{position:absolute;top:360px;right:40px;z-index:2}
  .enamel-sign{position:absolute;bottom:40px;left:50px;background:var(--yellow);color:var(--grease);padding:12px 20px;border:3px solid var(--grease);box-shadow:4px 4px 0 rgba(0,0,0,.35);font-family:"Big Shoulders Stencil Display";font-weight:700;font-size:22px;letter-spacing:.02em;max-width:420px}
  .enamel-sign strong{color:var(--grease);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
  .panel{flex:0 0 40%;background:#efe3cc;border-left:6px solid var(--grease);padding:40px 44px;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
  .clip{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#8c8a85;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .work-order-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:28px}
  .wo-title{font-family:"Big Shoulders Stencil Display";font-weight:900;font-size:34px;letter-spacing:.06em;color:var(--ink)}
  .wo-step{font-family:"JetBrains Mono";font-weight:700;font-size:15px;color:var(--grease)}
  .field-row{margin-bottom:26px}
  .field-label{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;letter-spacing:.26em;font-size:13px;color:var(--grease);margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .field-label::before{content:"";display:inline-block;width:14px;height:14px;background:var(--yellow);border:2px solid var(--ink)}
  .field{background:transparent;border:none;border-bottom:3px dashed var(--grease);width:100%;padding:10px 2px;font-family:"Big Shoulders Stencil Display";font-weight:700;font-size:34px;color:var(--ink);letter-spacing:.02em}
  .field.filled{color:var(--red);border-bottom-style:solid}
  .field.ghost{color:rgba(23,17,13,.62)}
  .ladder{display:flex;gap:6px;margin-top:12px}
  .rung{flex:1;height:10px;background:#d9c9ad;border:1.5px solid var(--grease)}
  .rung.done{background:var(--yellow)}
  .rung.now{background:var(--red)}
  .wo-foot{position:absolute;bottom:40px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .cta{background:var(--red);color:var(--cream);padding:16px 28px;font-family:"Big Shoulders Stencil Display";font-weight:900;font-size:22px;letter-spacing:.12em;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--grease);cursor:pointer}
  .cta.ghost{background:transparent;color:var(--grease);border-color:var(--grease);box-shadow:none}
  .status{position:absolute;left:28px;right:28px;bottom:28px;height:56px;background:var(--grease);color:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:0 36px;font-family:"JetBrains Mono";font-weight:500;font-size:14px;letter-spacing:.04em;border-top:3px solid var(--yellow)}
  .status .cars{color:var(--yellow)}
  .status .due{color:var(--red)}
  .pulse{display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;margin-right:8px;box-shadow:0 0 0 3px rgba(195,52,33,.35)}
</style>
</head>
<body>
  <div class="wall"></div>
  <div class="frame"></div>
  <div class="nav">
    <div class="brand">CARFOLIO · ГАРАЖ</div>
    <div class="nav-dymo">
      <span class="dymo">гараж</span>
      <span class="dymo">обслуживание</span>
      <span class="dymo">профиль</span>
    </div>
  </div>
  <div class="main">
    <div class="board">
      <!-- empty tool silhouettes on the pegboard, waiting -->
      <svg class="silhouette s-wrench" viewBox="0 0 200 70" fill="currentColor"><path d="M8 35 Q8 10 32 10 Q46 10 50 24 L170 24 Q188 24 192 35 Q188 46 170 46 L50 46 Q46 60 32 60 Q8 60 8 35Z M22 35 A10 10 0 1 1 42 35 A10 10 0 1 1 22 35Z"/></svg>
      <svg class="silhouette s-filter" viewBox="0 0 120 120" fill="currentColor"><path d="M30 10 h60 l6 10 v90 q0 10 -10 10 h-52 q-10 0 -10 -10 v-90 Z M44 24 h32 v8 h-32z M38 42 h44 v6 h-44z M38 56 h44 v6 h-44z M38 70 h44 v6 h-44z M38 84 h44 v6 h-44z"/></svg>
      <svg class="silhouette s-plug" viewBox="0 0 60 120" fill="currentColor"><path d="M22 8 h16 v18 h-16z M18 26 h24 v8 h-24z M14 34 h32 v38 h-32z M22 72 h16 v30 l-8 10 l-8 -10z"/></svg>
      <svg class="silhouette s-funnel" viewBox="0 0 110 140" fill="currentColor"><path d="M8 10 h94 l-30 70 v50 h-34 v-50 Z"/></svg>
      <svg class="silhouette s-tire" viewBox="0 0 160 160" fill="currentColor"><path d="M80 10 A70 70 0 1 1 79.9 10 Z M80 40 A40 40 0 1 0 80.1 40 Z" fill-rule="evenodd"/><path d="M20 80 l12 0 M128 80 l12 0 M80 20 l0 12 M80 128 l0 12 M34 34 l9 9 M117 117 l9 9 M34 126 l9 -9 M117 43 l9 -9" stroke="currentColor" stroke-width="6" fill="none"/></svg>
      <svg class="silhouette s-brake" viewBox="0 0 140 140" fill="currentColor"><path d="M70 10 A60 60 0 1 1 69.9 10 Z M70 36 A34 34 0 1 0 70.1 36 Z" fill-rule="evenodd"/><path d="M70 36 l0 68 M70 70 l34 0 M70 70 l-34 0 M70 70 l24 24 M70 70 l-24 -24" stroke="currentColor" stroke-width="4" fill="none"/></svg>
      <div class="headline">
        <div class="kicker">step 1 of 4 · ваш гараж пуст</div>
        ПОВЕСЬТЕ<br>СВОЮ ПЕРВУЮ<br><em>МАШИНУ</em>
      </div>
      <svg class="arrow" width="100" height="120" viewBox="0 0 100 120" fill="#e5b21e" stroke="#17110d" stroke-width="4"><path d="M30 10 h40 v60 h20 l-40 40 l-40 -40 h20 Z"/></svg>
      <div class="enamel-sign" data-impeccable-ignore="hard-offset-shadow">
        hooks waiting. <strong>нечего обслуживать</strong>, пока не вспомните, с какой машины начинается этот гараж.
      </div>
    </div>
    <div class="panel">
      <div class="clip"></div>
      <div class="work-order-head">
        <div class="wo-title">НАРЯД № 0001</div>
        <div class="wo-step">step 1 / 4</div>
      </div>
      <div class="field-row">
        <div class="field-label">марка</div>
        <input class="field filled" value="HONDA" readonly>
      </div>
      <div class="field-row">
        <div class="field-label">модель</div>
        <input class="field ghost" value="— вводится дальше" readonly>
      </div>
      <div class="field-row">
        <div class="field-label">год</div>
        <input class="field ghost" value="— вводится дальше" readonly>
      </div>
      <div class="field-row">
        <div class="field-label">пробег</div>
        <input class="field ghost" value="— вводится дальше" readonly>
      </div>
      <div class="ladder" aria-hidden="true">
        <div class="rung now"></div><div class="rung"></div><div class="rung"></div><div class="rung"></div>
      </div>
      <div class="wo-foot">
        <button class="cta ghost">← назад</button>
        <button class="cta" data-impeccable-ignore="hard-offset-shadow">далее →</button>
      </div>
    </div>
  </div>
  <div class="status">
    <div><span class="pulse"></span>0 машин · 0 работ · 0 просрочено</div>
    <div class="cars">INV / 0000</div>
  </div>
</body>
</html>
